<p>login-form works!</p>
<div class="login-container">
    <h2>Login</h2>
  
    <form [formGroup]="loginForm" (ngSubmit)="OnSubimit()">
      <!-- Campo de Login -->
      <div class="form-group">
        <label for="login">Usuário:</label>
        <input id="login" type="text" formControlName="login" class="form-control" placeholder="Digite seu login" />
        <div *ngIf="loginForm.controls['login'].invalid && loginForm.controls['login'].touched" class="error">
          O login é obrigatório.
        </div>
      </div>
  
      <!-- Campo de Senha -->
      <div class="form-group">
        <label for="password">Senha:</label>
        <input id="password" type="password" formControlName="password" class="form-control" placeholder="Digite sua senha" />
        <div *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched" class="error">
          A senha é obrigatória.
        </div>
      </div>
  
      <!-- Botão de Login -->
      <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">
        Entrar
      </button>
    </form>
  </div>
